services:
  echotrace-ui:
    build:
      context: .
      target: dev
    ports:
      - "3000:3000"
    env_file:
      - .env.local
    environment:
      ECHOTRACE_API_URL: http://127.0.0.1:3000
      MCP_INTERNAL_URL: http://127.0.0.1:8090
      MCP_DATA_DIR: /data/echotrace-mcp
    volumes:
      - .:/app
      - /app/node_modules
      - ${LOCAL_AUDIO_FILES_PATH:-./audio}:/data/knowledge/audio
      - echotrace_mcp_data:/data/echotrace-mcp
    restart: unless-stopped

volumes:
  echotrace_mcp_data:
